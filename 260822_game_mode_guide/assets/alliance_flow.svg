<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">정보 연합전 진행 흐름</title>
  <desc id="desc">비밀 투표, 개인 단서, 팀 답의 세 단계</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4c416f" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#7667e8"/>
    </marker>
  </defs>
  <rect width="1200" height="360" rx="34" fill="#f7f4ff"/>
  <path d="M360 180 H455" stroke="#7667e8" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M745 180 H840" stroke="#25bba5" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="35" y="55" width="315" height="250" rx="30" fill="#ffffff" stroke="#d9d1ff" stroke-width="4"/>
    <circle cx="192" cy="125" r="46" fill="#ffcf72"/>
    <path d="M162 126 h60 v46 h-60z M170 126 l22-18 22 18" fill="#ffffff" stroke="#645a82" stroke-width="5" stroke-linejoin="round"/>
    <text x="192" y="220" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="42" font-weight="800" fill="#25223a">비밀 투표</text>
    <text x="192" y="266" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="28" fill="#5f5a75">한 곳에 1표</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="445" y="55" width="315" height="250" rx="30" fill="#ffffff" stroke="#bdebe2" stroke-width="4"/>
    <circle cx="602" cy="125" r="46" fill="#79d7c5"/>
    <path d="M575 106 h54 v38 h-31 l-15 14 v-14 h-8z" fill="#ffffff" stroke="#356c63" stroke-width="5" stroke-linejoin="round"/>
    <text x="602" y="220" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="42" font-weight="800" fill="#25223a">개인 단서</text>
    <text x="602" y="266" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="28" fill="#5f5a75">말로 합치기</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="855" y="55" width="315" height="250" rx="30" fill="#ffffff" stroke="#ffc8cf" stroke-width="4"/>
    <circle cx="1012" cy="125" r="46" fill="#ff8693"/>
    <path d="M984 104 h56 v50 h-56z M995 122 h34 M995 136 h24" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <text x="1012" y="220" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="42" font-weight="800" fill="#25223a">팀 답 1개</text>
    <text x="1012" y="266" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="28" fill="#5f5a75">순위 + 표 수</text>
  </g>
</svg>
